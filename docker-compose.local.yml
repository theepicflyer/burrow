# Local prod-parity stack.
#
# Same Dockerfile and runtime layout as production, but the image is built
# from the local source tree (so feature branches are exercised) and the
# database lives in a named docker volume instead of a bind mount. Use this
# as the default "run it locally" command:
#
#   docker compose -f docker-compose.local.yml up -d --build
#
# See CLAUDE.md for the full dev workflow.

volumes:
  wygiwyh_pg_data: {}

services:
  web:
    build:
      context: .
      dockerfile: ./docker/prod/django/Dockerfile
    image: wygiwyh_local:latest
    container_name: ${SERVER_NAME}
    ports:
      - "${OUTBOUND_PORT:-8000}:${INTERNAL_PORT:-8000}"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-bookworm
    container_name: ${DB_NAME}
    restart: unless-stopped
    volumes:
      - wygiwyh_pg_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}
      - POSTGRES_DB=${SQL_DATABASE}
