name: Build and Push (reusable)

# Reusable build/push of the prod Django image to GHCR.
# Called by release.yml (nightly/dispatch/release) and version-bump.yml
# (label-driven semver). Centralises the build so the build logic and the
# GHA cache scope live in exactly one place.

on:
  workflow_call:
    inputs:
      image_tags:
        description: 'Newline-delimited tag list (as produced by docker/metadata-action)'
        required: true
        type: string
      version:
        description: 'Value for the VERSION build-arg (baked into APP_VERSION)'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout and build'
        required: false
        default: 'main'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/prod/django/Dockerfile
          push: true
          provenance: false
          tags: ${{ inputs.image_tags }}
          build-args: |
            VERSION=${{ inputs.version }}
          platforms: linux/amd64,linux/arm64

          # --- CACHE CONFIGURATION ---
          # Keep this scope key identical across all callers so the nightly,
          # dispatch, release and semver builds all share one GHA cache.
          #
          # cache-to has ignore-error=true because pull_request-triggered
          # callers (version-bump.yml) get a GHA cache token that is
          # read-only for the base branch's cache scope (GitHub's
          # cache-poisoning protection) — the cache *write* would otherwise
          # fail the whole buildx solve. push-triggered callers (nightly,
          # dispatch, release) get a writable token and populate the cache
          # normally; ignore-error is a no-op for them.
          cache-from: type=gha,scope=build-cache
          cache-to: type=gha,mode=max,scope=build-cache,ignore-error=true
