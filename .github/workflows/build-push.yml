name: Build and Push (reusable)

# Reusable build/push of the prod Django image to GHCR, called by release.yml.
# The image carries the commit it was built from in the
# org.opencontainers.image.revision label; the deployer checks it against the
# release tag before deploying.

on:
  workflow_call:
    inputs:
      image_tags:
        description: 'Newline-delimited tag list (as produced by docker/metadata-action)'
        required: true
        type: string
      version:
        description: 'Value for the VERSION build-arg (baked into APP_VERSION)'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout and build'
        required: false
        default: 'main'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/prod/django/Dockerfile
          push: true
          provenance: false
          tags: ${{ inputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
          platforms: linux/amd64

          # --- CACHE CONFIGURATION ---
          # One scope shared by nightly, release and dispatch builds.
          cache-from: type=gha,scope=build-cache
          cache-to: type=gha,mode=max,scope=build-cache,ignore-error=true
