name: Version Bump

# Label-driven semantic-versioning on merge to main.
#
# A merged PR carrying exactly one of version/{major,minor,patch} triggers an
# auto-bump from the latest GitHub release: it builds and pushes the prod image
# tagged ghcr.io/<repo>:<X.Y.Z> + :latest (version baked into APP_VERSION), then
# creates the matching GitHub release LAST so a release never points at a missing
# image. A PR with no version/* label does nothing here (the push to main already
# shipped :nightly via release.yml) -- no bump, no failure.
#
# Note: the release here is created with GITHUB_TOKEN, so it deliberately does NOT
# re-trigger release.yml's `release: created` path (Actions does not recurse on
# events raised by the default token). That is intentional -- the image was
# already built by this workflow's `build` job, so a second build would be wasted.

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

# Share release.yml's concurrency group so the two merge-triggered runs (this
# versioned build + release.yml's nightly build) serialize instead of racing on
# the same buildx GHA cache scope -- the second reuses the first's warm cache.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.calc.outputs.skip }}
      new_version: ${{ steps.calc.outputs.new_version }}
      tags: ${{ steps.calc.outputs.tags }}
      version: ${{ steps.calc.outputs.version }}
      sha: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Determine bump level and compute next version
        id: calc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # Pick bump level with precedence major > minor > patch.
          level=""
          if echo "$LABELS" | grep -q '"version/major"'; then
            level="major"
          elif echo "$LABELS" | grep -q '"version/minor"'; then
            level="minor"
          elif echo "$LABELS" | grep -q '"version/patch"'; then
            level="patch"
          fi

          if [ -z "$level" ]; then
            echo "No version/* label found; skipping bump (nightly already shipped)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Bump level: $level"

          # Fetch the latest release tag, if any.
          latest="$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || true)"

          if [ -z "$latest" ]; then
            # First run ever: seed the baseline regardless of label.
            new_version="v1.0.0"
            echo "No existing release; seeding baseline $new_version."
          else
            echo "Latest release: $latest"
            # Parse vX.Y.Z
            ver="${latest#v}"
            IFS='.' read -r major minor patch <<< "$ver"
            case "$level" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            new_version="v${major}.${minor}.${patch}"
          fi

          version="${new_version#v}"
          echo "New version: $new_version"

          {
            echo "skip=false"
            echo "new_version=$new_version"
            echo "version=$version"
            # Newline-delimited image tag list for build-push.yml.
            printf 'tags<<EOF\n%s\n%s\nEOF\n' "${IMAGE_NAME}:${version}" "${IMAGE_NAME}:latest"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    if: needs.bump.outputs.skip != 'true'
    uses: ./.github/workflows/build-push.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      image_tags: ${{ needs.bump.outputs.tags }}
      version: ${{ needs.bump.outputs.version }}
      ref: ${{ needs.bump.outputs.sha }}

  release:
    needs: [ bump, build ]
    if: needs.bump.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Created AFTER the image is confirmed pushed, so a release never points at
      # a missing image. Created by GITHUB_TOKEN -> does not re-trigger release.yml.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NEW_VERSION: ${{ needs.bump.outputs.new_version }}
          SHA: ${{ needs.bump.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$NEW_VERSION" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "$NEW_VERSION" \
            --generate-notes
