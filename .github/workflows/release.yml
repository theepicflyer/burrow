name: Release Pipeline

on:
  release:
    types: [ created ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag name for the image'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout'
        required: true
        default: 'main'
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      # This action handles all the logic for tags (nightly vs release vs custom)
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Logic for Push to Main -> nightly
            type=raw,value=nightly,enable=${{ github.event_name == 'push' }}
            # Logic for Release -> semver and latest
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            # Logic for Manual Dispatch -> custom input
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

  build:
    needs: meta
    uses: ./.github/workflows/build-push.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      image_tags: ${{ needs.meta.outputs.tags }}
      version: ${{ needs.meta.outputs.version }}
      ref: ${{ inputs.ref || github.ref }}
