{% extends "layouts/base.html" %}

{% block title %}{% translate 'Deleted transactions' %}{% endblock %}

{% block content %}

    <c-burrow.habitat kind="burrow" mood="sleepy">
      <div class="bh-habitat__eyebrow">{% translate 'Transactions' %}</div>
      <h1 class="bh-page-title">{% translate 'Deleted transactions' %}</h1>

    <div hx-get="{% url 'transactions_trash_list' %}" hx-trigger="load, updated from:window" class="show-loading"></div>

{% endblock %}
