{% extends "layouts/base.html" %}
{% load i18n %}

{% block title %}{% translate 'Export and Restore' %}{% endblock %}

{% block content %}
  <div class="container">
    <c-burrow.habitat kind="river" mood="busy">
      <div class="bh-habitat__eyebrow">{% translate 'Management' %}</div>
      <h1 class="bh-page-title">{% translate 'Export and Restore' %}</h1>
    </c-burrow.habitat>

    <div class="card bg-base-100 shadow-xl">
      <div class="card-body flex-row flex-wrap gap-3">
        <button class="btn btn-primary"
                hx-get="{% url 'export_form' %}"
                hx-target="#generic-offcanvas">
          <i class="fa-solid fa-download"></i>
          {% trans 'Export' %}
        </button>
        <button class="btn btn-secondary"
                hx-get="{% url 'restore_form' %}"
                hx-target="#generic-offcanvas">
          <i class="fa-solid fa-upload"></i>
          {% trans 'Restore' %}
        </button>
      </div>
    </div>
  </div>
{% endblock %}
