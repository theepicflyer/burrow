<div class="card card-border relative h-full shadow bg-base-100">
  <div class="bh-icon-tile bh-icon-tile--{{ color }} absolute right-3 top-3">
    {% if icon %}<i class="{{ icon }}"></i>{% else %}<span class="font-bold">{{ title.0 }}</span>{% endif %}
  </div>
  <div class="card-body">
    <h5 class="card-title mr-[50px] text-xl {{ title_css_classes }}" {{ attrs }}>{{ title }}{% if help_text %}<c-ui.help-icon :content="help_text" icon=""></c-ui.help-icon>{% endif %}</h5>
    {{ slot }}
  </div>
</div>
