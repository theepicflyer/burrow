{% load i18n %}
{# Add transaction: full-page paged UI on mobile (<lg), htmx offcanvas on desktop. #}
<div class="fab">
  <button type="button"
          class="btn btn-lg btn-circle btn-primary"
          aria-label="{% translate "Add transaction" %}"
          hx-get="{% url 'transaction_add' %}"
          hx-target="#generic-offcanvas"
          hx-trigger="click[window.innerWidth>=1024]"
          hx-vals='{"year": {{ year }}, {% if month %}"month": {{ month }},{% endif %} "type": "EX"}'
          onclick="if(window.innerWidth<1024){window.location.href='{% url 'transaction_simple_add' %}?type=EX{% if year %}&year={{ year }}{% endif %}{% if month %}&month={{ month }}{% endif %}';}">
    <i class="fa-solid fa-plus text-2xl fa-fw"></i>
  </button>
</div>
